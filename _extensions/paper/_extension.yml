title: PPOL 6818 paper
author: Benjamin Daniels
version: 1.0.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    typst:
      template-partials:
        - typst-template.typ
        - typst-show.typ
      font-paths:
        - fonts
      papersize: us-letter
      margin:
        x: 1in
        y: 1in
      number-sections: true
      date-format: "MMMM D, YYYY"
      fig-cap-location: top
      tbl-cap-location: top
