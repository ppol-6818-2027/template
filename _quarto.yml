# The minisite: a landing page, the slide deck and the two papers, built into
# docs/, the only public part of this repository. Build it with
# ppol6818::build_site(). The deck and each paper render to a PDF (formats
# deck-typst and paper-typst, from _extensions/), and a page shows each PDF
# (deck/index.qmd, midterm/index.qmd, final/index.qmd). Nothing runs during the build: run.R
# writes the exhibits into exhibits/, midterm/exhibits/ and final/exhibits/,
# and the pages and papers show them.
project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - deck.qmd
    - deck/index.qmd
    - midterm/midterm.qmd
    - midterm/index.qmd
    - final/final.qmd
    - final/index.qmd
  resources:
    - /exhibits/*

website:
  title: "PPOL 6818 project"
  navbar:
    left:
      - href: index.qmd
        text: Plan
      - href: deck/index.qmd
        text: Deck
      - href: midterm/index.qmd
        text: Registered report
      - href: final/index.qmd
        text: Final paper

  page-footer:
    center: "PPOL 6818 · McCourt School of Public Policy · Georgetown University"

execute:
  enabled: false

format:
  html:
    theme: [cosmo, site/theme.scss]
    toc: true
