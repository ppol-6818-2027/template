# The minisite: a landing page, a slide deck and the two papers, built into
# docs/, the only public part of this repository. Build it with
# ppol6818::build_site(). Each paper renders to a PDF (format paper-typst,
# from _extensions/paper/), and its page (midterm/index.qmd,
# final/index.qmd) shows that PDF. Nothing runs during the build: run.R
# writes the exhibits into exhibits/, midterm/exhibits/ and final/exhibits/,
# and the pages and papers show them.
project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - deck.qmd
    - midterm/midterm.qmd
    - midterm/index.qmd
    - final/final.qmd
    - final/index.qmd
  resources:
    - /exhibits/*

website:
  title: "PPOL 6818 project"
  navbar:
    left:
      - href: index.qmd
        text: Plan
      - href: deck.qmd
        text: Deck
      - href: midterm/index.qmd
        text: Registered report
      - href: final/index.qmd
        text: Final paper

execute:
  enabled: false

format:
  html:
    theme: [cosmo, site/theme.scss]
    toc: true
